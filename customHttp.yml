customHeaders:
  # ---------------------------------------------------------------------------
  # One rule, applied site-wide.
  #
  # NOTE ON Content-Security-Policy: it is deliberately NOT set here.
  # Each HTML page carries its own CSP in a <meta> tag, because the homepage and
  # the warrants tool need different policies (the tool loads pdf.js and mammoth
  # from cdnjs and calls the AI backend; the homepage should allow neither).
  # Setting a CSP here as well would send two policies for the tool page, and the
  # browser enforces the STRICTER of the two — which blocks the tool's libraries.
  #
  # Clickjacking is still covered by X-Frame-Options below, since the
  # frame-ancestors directive is ignored when CSP is delivered via a meta tag.
  # ---------------------------------------------------------------------------
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=63072000; includeSubDomains; preload'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
